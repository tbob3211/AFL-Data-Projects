name: Update AFL Ladder
 
on:
  schedule:
    - cron: '0 */6 * * *'  # runs every 6 hours automatically
  workflow_dispatch:         # lets you trigger it manually anytime
 
jobs:
  update-ladder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
 
      - name: Fetch ladder from Squiggle API
        run: |
          curl "https://api.squiggle.com.au/?q=standings" \
            -H "User-Agent: AFL Draft Simulator (tbob3211 on GitHub)" \
            -o ladder.json
 
      - name: Commit and push ladder.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add ladder.json
          git diff --staged --quiet || git commit -m "Update ladder data [skip ci]"
          git push