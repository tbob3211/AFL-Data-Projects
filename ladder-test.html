<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Squiggle Ladder Test</title>
  <style>
    body { font-family: monospace; padding: 2rem; background: #f5f5f5; }
    h2 { font-family: sans-serif; }
    #output { background: white; padding: 1rem; border-radius: 8px; border: 1px solid #ddd; white-space: pre-wrap; }
    .ok  { color: green; font-weight: bold; }
    .err { color: red;   font-weight: bold; }
  </style>
</head>
<body>

<h2>Squiggle API — Ladder Test</h2>
<p id="status">Fetching...</p>
<div id="output"></div>

<script>
  const SQUIGGLE_URL = 'https://api.squiggle.com.au/?q=standings&year=2026';
  const PROXY        = 'https://api.allorigins.win/get?url=';

  async function test() {
    const statusEl = document.getElementById('status');
    const outputEl = document.getElementById('output');

    try {
      statusEl.textContent = '1. Fetching via allorigins proxy...';

      const res = await fetch(PROXY + encodeURIComponent(SQUIGGLE_URL));

      statusEl.textContent = `2. Got HTTP ${res.status} from proxy`;

      const wrapper = await res.json();
      statusEl.textContent = '3. Parsed proxy wrapper OK';

      const data = JSON.parse(wrapper.contents);
      statusEl.textContent = '4. Parsed Squiggle JSON OK';

      const standings = data.standings;

      if (!standings || standings.length === 0) {
        statusEl.innerHTML = '<span class="err">✗ standings array is empty</span>';
        outputEl.textContent = JSON.stringify(data, null, 2);
        return;
      }

      // Sort by rank ascending (1 = top of ladder)
      standings.sort((a, b) => a.rank - b.rank);

      statusEl.innerHTML = `<span class="ok">✓ Success! ${standings.length} teams loaded</span>`;

      // Display ladder top → bottom, then draft order bottom → top
      let out = '=== CURRENT AFL LADDER ===\n';
      standings.forEach(t => {
        out += `  ${String(t.rank).padStart(2)}. ${t.name.padEnd(25)} W:${t.wins} L:${t.losses} — played ${t.played}\n`;
      });

      out += '\n=== DRAFT ORDER (worst → best) ===\n';
      [...standings].reverse().forEach((t, i) => {
        out += `  Pick ${String(i + 1).padStart(2)}: ${t.name}\n`;
      });

      outputEl.textContent = out;

    } catch (err) {
      statusEl.innerHTML = `<span class="err">✗ Error: ${err.message}</span>`;
      outputEl.textContent = err.stack || err.message;
    }
  }

  test();
</script>
</body>
</html>
