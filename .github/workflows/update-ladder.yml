name: Update AFL Ladder

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ladder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch and commit ladder
        run: |
          curl "https://api.squiggle.com.au/?q=standings" -H "User-Agent: AFL Draft Simulator (tbob3211)" -o ladder.json
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add ladder.json
          git diff --staged --quiet || git commit -m "Update ladder data [skip ci]"
          git push
